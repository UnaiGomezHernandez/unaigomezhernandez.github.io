# Basic
name:               "Unai Gómez-Hernández"
title:              "Unai Gómez-Hernández | Researcher and policy analyst"
description:        "Researcher and policy analyst working on EU external action, EU–China relations, geoeconomics, artificial intelligence, and strategic communication."


# URL
url:                https://unaigomezhernandez.github.io
baseurl:
#baseurl:            "" #For Root Domain
permalink:          /:year/:month/:day/:title.html

# Markdown
markdown:           kramdown

# Navigation
nav:
  - name:           "home"
    href:           "/"
  - name:           "publications"
    href:           "/publications/"
  - name:           "contact"
    href:           "/contact/"



# Sass
sass:
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"

# Exclude these files from your production _site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME

  # Inherited theme demo posts are not this researcher’s work. Keep sources only.
  - _posts
  - scripts
  - vendor
  - .bundle
